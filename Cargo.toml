
[package]
name = "tally"
version = "1.0.0"
edition = "2021"
description = "Safe, undoable folder organizer"
license = "MIT"

[lib]
name = "tally"
path = "src/lib.rs"

[[bin]]
name = "tally"
path = "src/main.rs"

[[bin]]
name = "tally-gui"
path = "src/bin/tally-gui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
eframe = "0.31"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
